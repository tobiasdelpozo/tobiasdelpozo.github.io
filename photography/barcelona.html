<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tobiasdelpozo</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="container">

    <header class="navbar bb b--black mb3">
        <div class="navbar-section">
            <h2>~ / <a href="../index.html" title="Home" class="no-decoration">Home</a> / Barcelona</h2>
        </div>
        
        <div class="navbar-section" style="margin-left: auto;">
            <div class="status-box">
                <span class="status-glyph">●</span> 
                <span class="status-text">Status: Online</span>
            </div>
        </div>
    </header>

    <main>
        <div class="columns">
            <!-- Left Info Column -->
            <div class="column col-30">
                <div class="mb4">
                    <table class="table meta-table">
                        <thead class="black bg-light-gray ba b--black">
                            <tr>
                                <th>Info</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <span class="meta-location">Barcelona, Spain</span>
                                    <span class="meta-year">2021</span>
                                </td>
                            </tr>
                            <tr><td>Pentax K1000</td></tr>
                            <tr><td>Ektar 100</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Gallery Column -->
            <div class="column col-70">
                <div class="gallery-grid">
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_01.jpg" alt="Barcelona 01"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_02.jpg" alt="Barcelona 02"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_03.jpg" alt="Barcelona 03"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_04.jpg" alt="Barcelona 04"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_05.jpg" alt="Barcelona 05"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_06.jpg" alt="Barcelona 06"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_07.jpg" alt="Barcelona 07"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_08.jpg" alt="Barcelona 08"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_09.jpg" alt="Barcelona 09"></div>
                    <div class="gallery-item"><img src="../images/barcelona/barcelona_10.jpg" alt="Barcelona 10"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="spec-sheet container">
        <div class="spec-item">PAPER: <span class="spec-value">#F4F1EA</span></div>
        <div class="spec-item">INK: <span class="spec-value">#1A1A1A</span></div>
        <div class="spec-item">KERNING: <span class="spec-value">OPTICAL</span></div>
        <div class="spec-item">FONT: <span class="spec-value">TX-02_RETINA</span></div>
        <div class="spec-item">GRID: <span class="spec-value">12_COL_DYNAMIC</span></div>
        <div class="spec-item" style="margin-left: auto;">CONTACT: <a href="mailto:contact@tobiasdelpozo.com" class="spec-value">contact@tobiasdelpozo.com</a></div>
    </footer>

    <script src="../gallery.js"></script>
</body>
</html>
