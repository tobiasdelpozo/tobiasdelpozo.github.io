<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tobiasdelpozo</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="container">

    <header class="navbar bb b--black mb3">
        <div class="navbar-section">
            <h2>~ / <a href="../index.html" title="Home" class="no-decoration">Home</a> / San Francisco</h2>
        </div>
        
        <div class="navbar-section" style="margin-left: auto;">
            <div class="status-box">
                <span class="status-glyph">●</span> 
                <span class="status-text">Status: Online</span>
            </div>
        </div>
    </header>

    <main>
        <div class="columns">
            <div class="column col-30">
                <div class="mb4">
                    <table class="table meta-table">
                        <thead class="black bg-light-gray ba b--black">
                            <tr><th>Info</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <span class="meta-location">San Francisco, USA</span>
                                    <span class="meta-year">2025</span>
                                </td>
                            </tr>
                            <tr><td>Pentax K1000</td></tr>
                            <tr><td>Ultramax 400</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="column col-70">
                <div class="gallery-grid">
                    <div class="gallery-item"><img src="../images/san_francisco/sf_1.JPG" alt="San Francisco 01"></div>
                    <div class="gallery-item"><img src="../images/san_francisco/sf_2.JPG" alt="San Francisco 02"></div>
                    <div class="gallery-item"><img src="../images/san_francisco/sf_3.JPG" alt="San Francisco 03"></div>
                    <div class="gallery-item"><img src="../images/san_francisco/sf_4.JPG" alt="San Francisco 04"></div>
                    <div class="gallery-item"><img src="../images/san_francisco/sf_5.JPG" alt="San Francisco 05"></div>
                    <div class="gallery-item"><img src="../images/san_francisco/sf_7.JPG" alt="San Francisco 07"></div>
                    <div class="gallery-item"><img src="../images/san_francisco/sf_8.JPG" alt="San Francisco 08"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="spec-sheet container">
        <div class="spec-item">PAPER: <span class="spec-value">#F4F1EA</span></div>
        <div class="spec-item">INK: <span class="spec-value">#1A1A1A</span></div>
        <div class="spec-item">KERNING: <span class="spec-value">OPTICAL</span></div>
        <div class="spec-item">FONT: <span class="spec-value">TX-02_RETINA</span></div>
        <div class="spec-item">GRID: <span class="spec-value">12_COL_DYNAMIC</span></div>
        <div class="spec-item" style="margin-left: auto;">CONTACT: <a href="mailto:contact@tobiasdelpozo.com" class="spec-value">contact@tobiasdelpozo.com</a></div>
    </footer>

    <script src="../gallery.js"></script>
</body>
</html>
