<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edinburgh</title>
    <link rel="stylesheet" href="../style.css"> </head>
<body>

    <header class="site-header">
        <div class="header-left">
            <a href="/" class="home-icon-link" aria-label="Homepage">
                <img src="../../icons/home.svg" alt="" class="home-icon"> </img>
            </a>
            <button id="contactBtn" class="contact-button">Contact Me</button>
        </div>
        <div class="dropdown">
            <button id="photographyDropdownToggle" class="dropdown-toggle icon-button" aria-label="Toggle photography menu">
                <img src="../icons/hamburger.svg" alt="" class="dropdown-icon"> </button>
            <div id="photographyDropdownContent" class="dropdown-content">
                <a href="/photography/san_francisco.html">San Francisco</a>
                <a href="/photography/london.html">London</a>
                <a href="/photography/edinburgh.html">Edinburgh</a>
                <a href="/photography/ben_lomond.html">Ben Lomond</a>
                <a href="/photography/barcelona.html">Barcelona</a>
            </div>
        </div>
    </header>

    <main class="gallery-container">

        <div class="gallery-header">
            <div class="gallery-info-left">
                <span class="location">San Francisco</span>, <span class="date">2025</span>
            </div>
            <div class="gallery-info-right">
                <span class="camera-info">Pentax K1000</span>, <span class="film-info">Ultramax 400/Superia 400</span>
            </div>
        </div>

        <div id="imageGrid" class="image-grid">
            <p>Loading images...</p> </div>

    </main>
    <div id="lightbox" class="lightbox">
        <span id="lightboxClose" class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImg" src="" alt="Enlarged view">
        <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

    <script type="application/json" id="galleryData">
      [
        { "src": "../../images/san_francisco/sf_1.JPG"},
        { "src": "../../images/san_francisco/sf_2.JPG"},
        { "src": "../../images/san_francisco/sf_3.JPG"},
        { "src": "../../images/san_francisco/sf_4.JPG"},
        { "src": "../../images/san_francisco/sf_5.JPG"},
        { "src": "../../images/san_francisco/sf_7.JPG"},
        { "src": "../../images/san_francisco/sf_8.JPG"}
      ]
    </script>

    <div id="contactModal" class="modal">
       </div>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <script src="../../dist/main.js" defer></script>

</body>
</html>
