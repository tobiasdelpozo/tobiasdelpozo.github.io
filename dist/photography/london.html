<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tobiasdelpozo</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="container">

    <header class="navbar bb b--black mb3">
        <div class="navbar-section">
            <h2>~ / <a href="../index.html" title="Home" class="no-decoration">Home</a> / London</h2>
        </div>
        
        <div class="navbar-section" style="margin-left: auto;">
            <div class="status-box">
                <span class="status-glyph">●</span> 
                <span class="status-text">Status: Online</span>
            </div>
        </div>
    </header>

    <main>
        <div class="columns">
            <div class="column col-30">
                <div class="mb4">
                    <table class="table meta-table">
                        <thead class="black bg-light-gray ba b--black">
                            <tr><th>Info</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <span class="meta-location">London, UK</span>
                                    <span class="meta-year">2021</span>
                                </td>
                            </tr>
                            <tr><td>Pentax K1000</td></tr>
                            <tr><td>ColorPlus 200</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="column col-70">
                <div class="gallery-grid">
                    <div class="gallery-item"><img src="../images/london/london_01.jpg" alt="London 01"></div>
                    <div class="gallery-item"><img src="../images/london/london_02.jpg" alt="London 02"></div>
                    <div class="gallery-item"><img src="../images/london/london_03.jpg" alt="London 03"></div>
                    <div class="gallery-item"><img src="../images/london/london_04.jpg" alt="London 04"></div>
                    <div class="gallery-item"><img src="../images/london/london_05.jpg" alt="London 05"></div>
                    <div class="gallery-item"><img src="../images/london/london_06.jpg" alt="London 06"></div>
                    <div class="gallery-item"><img src="../images/london/london_07.jpg" alt="London 07"></div>
                    <div class="gallery-item"><img src="../images/london/london_08.jpg" alt="London 08"></div>
                    <div class="gallery-item"><img src="../images/london/london_09.jpg" alt="London 09"></div>
                    <div class="gallery-item"><img src="../images/london/london_10.jpg" alt="London 10"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="../dist/main.js"></script>
</body>
</html>
